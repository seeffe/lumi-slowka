<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141a33">
<title>Lumi Słówka</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#141a33; --bg2:#1c2447; --card:#232d58; --card2:#2c3870;
  --text:#f3f5ff; --muted:#a9b2dd; --accent:#ffd34d; --good:#4ade80; --bad:#fb7185;
  --teal:#5eead4; --pink:#f9a8d4; --violet:#a78bfa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Nunito","Comic Sans MS",system-ui,-apple-system,Roboto,sans-serif;touch-action:manipulation;overflow:hidden}
body{background:radial-gradient(circle at 50% 0%,#26306a 0%,var(--bg) 60%) fixed}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:12px 16px calc(12px + env(safe-area-inset-bottom));position:relative}
.top{display:flex;align-items:center;gap:6px;min-height:48px}
.pill{background:var(--card);border-radius:999px;padding:6px 10px;white-space:nowrap;flex-shrink:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:4px}
.spacer{flex:1}
.iconbtn{flex-shrink:0;width:48px;height:48px;border-radius:50%;background:var(--card);font-size:24px;display:grid;place-items:center}
/* touch-action:none — иначе Chrome на телефоне считает дрожание пальца прокруткой и отменяет удержание */
.gear{opacity:.35;font-size:20px;width:40px;height:40px;touch-action:none;-webkit-touch-callout:none}
.gear.holding{opacity:1;animation:gearhold 2s linear forwards}
@keyframes gearhold{from{box-shadow:0 0 0 0 var(--accent)}to{box-shadow:0 0 0 12px var(--accent);transform:rotate(180deg)}}

/* Lumi */
.lumiwrap{position:relative;display:flex;justify-content:center;align-items:flex-end}
.lumi{position:relative;width:220px;height:220px;animation:float 3s ease-in-out infinite}
.lumi.small{width:110px;height:110px}
.lumi svg{width:100%;height:100%;overflow:visible}
.lumi .hat{position:absolute;left:50%;top:-6%;transform:translateX(-50%) rotate(-8deg);font-size:calc(var(--s,220px)*.36);line-height:1;z-index:2;filter:drop-shadow(0 4px 4px #0006)}
.lumi.small .hat{--s:110px}
.lumi .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.lumi .mouth{transform-box:fill-box;transform-origin:center}
.lumi.talk .mouth{animation:talk .22s ease-in-out infinite alternate}
.lumi .sleepeyes{display:none}
.lumi.sleep .eyes{display:none}.lumi.sleep .sleepeyes{display:inline}
.lumi.sleep{animation:float 6s ease-in-out infinite}
.lumi.jump{animation:jump .6s ease}
.lumi .antball{animation:glow 2s ease-in-out infinite alternate}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(.5)}to{transform:scaleY(1.6)}}
@keyframes jump{0%{transform:translateY(0)}40%{transform:translateY(-40px) rotate(-6deg)}70%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes glow{from{opacity:.7}to{opacity:1}}
.zzz{position:absolute;right:18%;top:0;font-size:30px;font-weight:900;color:var(--muted);animation:zz 2.5s infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,10px)}50%{opacity:1}100%{opacity:0;transform:translate(20px,-30px)}}

.bubble{background:var(--card2);border-radius:22px;padding:12px 18px;font-size:22px;font-weight:800;text-align:center;margin:8px auto;max-width:94%;position:relative;min-height:1.6em}
.bubble:empty{visibility:hidden}

.home{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px}
.play{margin:10px auto;background:linear-gradient(180deg,#ffe073,#ffb627);color:#3a2600;font-size:34px;font-weight:900;border-radius:32px;padding:20px 48px;box-shadow:0 8px 0 #c98400,0 14px 30px #0008;animation:pulse 1.6s ease-in-out infinite}
.play:active{transform:translateY(6px);box-shadow:0 2px 0 #c98400}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.05}}
.homebtns{display:flex;gap:10px;justify-content:center}
.bigbtn{background:var(--card);border-radius:24px;padding:14px 8px;font-size:20px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;max-width:140px}
.bigbtn span{font-size:40px}

/* lesson */
.lessontop{display:flex;align-items:center;gap:8px}
.progress{flex:1;height:14px;background:var(--card);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--accent));width:0;transition:width .4s}
.lessonhead{display:flex;align-items:center;gap:6px}
.lessonhead .bubble{flex:1;margin:0;font-size:20px;text-align:left}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative;overflow:hidden}
.big{font-size:150px;line-height:1.1;filter:drop-shadow(0 8px 10px #0007)}
.pic{display:inline-grid;place-items:center}
.colorblob{width:1em;height:1em;border-radius:42% 58% 55% 45%/50% 45% 55% 50%;box-shadow:inset -10px -12px 0 #0003,0 6px 12px #0006}
.numpic{font-weight:900;color:var(--accent);font-size:.85em;line-height:1}
.word{font-size:46px;font-weight:900;letter-spacing:1px}
.plword{font-size:24px;color:var(--muted);font-weight:700;margin-top:-10px}
.row{display:flex;gap:18px;align-items:center;justify-content:center}
.again{width:72px;height:72px;border-radius:50%;background:var(--card2);font-size:34px}
.mic{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff9db8,#e1306c);font-size:52px;box-shadow:0 8px 0 #9c1d4a,0 10px 24px #0008}
.mic:active{transform:translateY(5px);box-shadow:0 3px 0 #9c1d4a}
.mic.on{animation:micpulse 1s infinite;background:radial-gradient(circle at 40% 35%,#ffe073,#ff8a00);box-shadow:0 8px 0 #b35c00}
@keyframes micpulse{0%{box-shadow:0 0 0 0 #ffb62799}100%{box-shadow:0 0 0 30px #ffb62700}}
.next{background:var(--card2);font-size:24px;font-weight:900;border-radius:20px;padding:12px 28px}
.hidden{display:none!important}
.grid{display:grid;gap:14px;width:100%}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:1fr 1fr}
.tile{background:var(--card);border-radius:26px;aspect-ratio:1;font-size:min(80px,18vw);display:grid;place-items:center;box-shadow:0 6px 0 #10173a}
.g3 .tile{font-size:min(70px,17vw)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 #10173a}
.tile.ok{background:#1f6b45;animation:jump .5s}
.tile.no{animation:shake .4s;background:#5b2440}
.tile.gone{opacity:.25;pointer-events:none}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-10px) rotate(-4deg)}75%{transform:translateX(10px) rotate(4deg)}}
.yn{display:flex;gap:24px}
.yn button{width:120px;height:110px;border-radius:30px;font-size:60px;box-shadow:0 7px 0 #0006}
.yes{background:#1f8a55}.nob{background:#b33a5a}

/* balloons */
.sky{position:absolute;inset:0}
/* шарики влетают снизу и дальше покачиваются на месте — за экран не улетают */
.balloon{position:absolute;width:96px;height:118px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;display:grid;place-items:center;font-size:50px;
  animation:risein 1.4s cubic-bezier(.2,.8,.3,1) both,bob 3s ease-in-out infinite;box-shadow:inset -12px -14px 0 #0002}
.balloon::after{content:"";position:absolute;bottom:-38px;left:50%;width:2px;height:38px;background:#fff8}
.balloon.pop{animation:pop .35s forwards}
.balloon.no{filter:brightness(.6)}
@keyframes risein{from{transform:translateY(110dvh)}to{transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-16px) rotate(3deg)}}
@keyframes pop{to{transform:scale(1.8);opacity:0}}

/* memory */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.card{aspect-ratio:3/4;border-radius:20px;background:linear-gradient(135deg,var(--violet),#6d28d9);font-size:min(56px,13vw);display:grid;place-items:center;box-shadow:0 6px 0 #3b1a7a;transition:transform .25s}
.card .face{display:none}
.card.open{background:var(--card2);box-shadow:0 6px 0 #10173a}
.card.open .face{display:block}.card.open .back{display:none}
.card.done{background:#1f6b45;box-shadow:0 6px 0 #124a2f}
.back{font-size:.6em;opacity:.8}

/* gift & stickers */
.gift{font-size:150px;animation:wiggle 1s infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.reveal{font-size:170px;animation:revealIn .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes revealIn{from{transform:scale(0) rotate(-180deg)}to{transform:none}}
.title{font-size:28px;font-weight:900;text-align:center;margin:6px 0}
.scroll{flex:1;overflow-y:auto;padding-bottom:10px}
.album{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.st{background:var(--card);border-radius:18px;aspect-ratio:1;font-size:min(46px,11vw);display:grid;place-items:center;position:relative}
.st.lock{opacity:.35;filter:grayscale(1)}
.st b{position:absolute;right:6px;bottom:4px;font-size:14px;background:var(--accent);color:#3a2600;border-radius:9px;padding:0 6px}
.wardrobe{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wi{background:var(--card);border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:18px}
.wi span{font-size:44px}
.wi.on{outline:4px solid var(--accent)}
.wi.cant{opacity:.45}

/* parent */
.parent{flex:1;overflow-y:auto;font-family:system-ui,Roboto,sans-serif;font-size:16px;user-select:text;-webkit-user-select:text}
.parent h2{font-size:20px;margin:18px 0 8px}
.parent .box{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.parent button{background:var(--card2);border-radius:10px;padding:10px 14px;font-weight:700;margin:4px 4px 4px 0}
.parent button.sel{background:var(--accent);color:#3a2600}
.parent input{background:var(--bg2);border:1px solid var(--card2);color:var(--text);border-radius:10px;padding:10px;font-size:16px;width:100%}
.parent table{width:100%;border-collapse:collapse;font-size:15px}
.parent td{padding:5px 4px;border-bottom:1px solid #ffffff12}
.dots{letter-spacing:2px;color:var(--accent);white-space:nowrap}
.stat{display:flex;gap:8px}.stat div{flex:1;background:var(--bg2);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:24px}
.danger{background:#7a2740!important}

/* confetti */
.cf{position:fixed;top:-20px;width:12px;height:16px;border-radius:3px;z-index:99;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105dvh) rotate(720deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:12px;font-size:15px;z-index:100;max-width:90%;text-align:center}
.pop{animation:revealIn .5s cubic-bezier(.2,1.6,.4,1)}

/* танец Lumi */
.lumi.dance{animation:dance 1.6s ease-in-out}
@keyframes dance{0%,100%{transform:none}15%{transform:translateY(-14px) rotate(-14deg)}30%{transform:scale(1.1,.9)}45%{transform:translateY(-14px) rotate(14deg)}60%{transform:scale(1.1,.9)}75%{transform:translateY(-20px) rotate(-8deg) scale(1.05)}}
.note{position:fixed;font-size:30px;pointer-events:none;z-index:98;color:var(--accent);animation:noteup 1.4s ease-out both}
@keyframes noteup{from{opacity:1;transform:none}to{opacity:0;transform:translate(var(--dx),-100px) rotate(20deg)}}
.lumi.nope{animation:shake .5s}

/* покорми Lumi */
.feedlumi .lumi{width:180px;height:180px}
.lumi.eat .mouth{animation:chomp .16s ease-in-out 6 alternate}
@keyframes chomp{from{transform:scale(1,.6)}to{transform:scale(1.5,2.6)}}
.feed .tile{touch-action:none}
.tile.drag{z-index:5;box-shadow:0 14px 24px #0009}
.tile.fly{transition:transform .45s ease-in,opacity .45s ease-in;opacity:0;pointer-events:none}
.tile.back{transition:transform .35s cubic-bezier(.2,1.4,.4,1)}

/* мини-диалоги */
.q{font-size:34px;font-weight:900;text-align:center}
.hint{font-size:18px;color:var(--muted);font-weight:700;text-align:center;margin-top:-8px}
.ans{background:var(--card);border-radius:18px;padding:10px 18px;font-size:26px;font-weight:900;color:var(--teal);text-align:center}

/* знакомство */
.colors{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.colors button{width:66px;height:66px;border-radius:50%;box-shadow:0 6px 0 #0006}
.colors button.on{outline:5px solid #fff}
.names{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%}
.names button{background:var(--card);border-radius:18px;padding:14px 4px;font-size:22px;font-weight:900}
.names button.on{background:var(--accent);color:#3a2600}
.kidname{font-size:46px;font-weight:900}
.obinput{background:var(--bg2);border:2px solid var(--card2);color:var(--text);border-radius:14px;padding:12px;font-size:26px;width:80%;text-align:center;user-select:text;-webkit-user-select:text}
.link{background:none;color:var(--muted);font-size:18px;font-weight:800;padding:8px}

/* карта путешествия */
.map{flex:1;overflow-y:auto;overflow-x:hidden;padding:30px 0 80px;display:flex;flex-direction:column;align-items:center;gap:16px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateX(var(--x))}
.stone{width:28px;height:28px;border-radius:50%;background:var(--card);box-shadow:0 4px 0 #10173a}
.stone.done{background:var(--accent);box-shadow:0 4px 0 #c98400}
.isl{width:160px;padding:10px 8px 14px;border-radius:46% 54% 48% 52%/58% 58% 42% 42%;background:radial-gradient(circle at 50% 35%,#3ccf8e,#1f7a5c);box-shadow:0 8px 0 #0d4a3a,0 0 0 8px #5eead422;text-align:center}
.isl .ie{font-size:58px;line-height:1.15}
.isl b{display:block;font-size:20px;font-weight:900}
.isl .iw{font-size:20px;display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:4px}
.isl.lock{background:var(--card);box-shadow:0 8px 0 #10173a;opacity:.55}
.isl.new{animation:revealIn 1s cubic-bezier(.2,1.6,.4,1)}
.me{position:absolute;bottom:50%;left:-34px;z-index:3;pointer-events:none}
.lumi.tiny{width:72px;height:72px}
.lumi.tiny .hat{--s:72px}
.mapbtn{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;box-shadow:0 6px 20px #000a}

/* диплом */
.dip{margin:6px auto;background:linear-gradient(160deg,#fff7d6,#ffe08a);color:#3a2600;border-radius:24px;padding:16px 12px;text-align:center;box-shadow:0 0 0 6px #ffd34d55,0 12px 30px #0008}
.dip h1{margin:0;font-size:34px;letter-spacing:3px}
.dip .kid{font-size:38px;font-weight:900;color:#b4234f}
.dip p{margin:4px 0;font-size:20px;font-weight:800}
.dw{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px 0}
.dw span.dwi{display:flex;flex-direction:column;align-items:center;font-size:36px;min-width:64px}
.dw small{font-size:15px;font-weight:900}
</style>
</head>

const NUM={one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10'};
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return m[a.length][b.length]}
function matches(alts,id){const w=W[id].en.toLowerCase().replace(/[^a-z ]/g,'');const tol=w.length>5?2:1;
  return alts.some(a=>{a=a.replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();if(!a)return false;
    if((' '+a+' ').includes(' '+w+' '))return true;if(NUM[w]&&a.split(' ').includes(NUM[w]))return true;
    if(lev(a.replace(/ /g,''),w.replace(/ /g,''))<=tol)return true;
    return a.split(' ').some(t=>t.length>2&&lev(t,w)<=tol&&!w.includes(' '));})}

  app.innerHTML=`<div class="top"><div class="spacer"></div>${volBtn()}</div><div class="bubble"></div><div class="lumiwrap">${lumiHTML()}</div><div class="stage" id="stage"></div>`;
  try{
    // 1) имя ребёнка: говорит в микрофон (по-польски) или мама вписывает
    stage().innerHTML=`<div class="kidname" id="kn"></div><div class="row" id="r1"><button class="mic">🎤</button></div>
      <div class="row yn hidden" id="r2"><button class="yes">👍</button><button class="nob">👎</button></div>
      <input class="obinput hidden" id="kin" maxlength="14" placeholder="Imię…" autocomplete="off"><button class="next hidden" id="kok">OK ✓</button>
      <button class="link" id="kbd">⌨️ wpisz</button><button class="link hidden" id="skip">Pomiń ➜</button>`;
    const show=(sel,on)=>$(sel).classList.toggle('hidden',!on);
    const typing=()=>{show('#kin',1);show('#kok',1);show('#skip',1);show('#kbd',0)};
    $('#kin').onkeydown=e=>{if(e.key==='Enter')$('#kok').click()};
    if(!SR)typing();
    let name='',fails=0;
    await sayP(my,'Cześć! Będziemy przyjaciółmi. Jak masz na imię?');
    await sayP(my,SR?'Naciśnij mikrofon i powiedz swoje imię!':'Poproś mamę, żeby wpisała twoje imię.');
    for(;;){const b=await tapOne('.mic,#kbd,#kok,#skip,.yes,.nob');guard(my);
      if(b.id==='kbd'){typing();$('#kin').focus();continue}
      if(b.id==='skip'){name='';break}
      if(b.id==='kok'){const v=cap(cleanName($('#kin').value));if(v){name=v;break}continue}
      if(b.classList.contains('yes'))break;
      if(b.classList.contains('nob')){name='';$('#kn').textContent='';show('#r2',0);show('#r1',1);await sayP(my,'Ups! Powiedz jeszcze raz.');continue}
      b.classList.add('on');bubble('Słucham… 👂');const r=await listen('pl-PL');b.classList.remove('on');guard(my);
      const v=r.ok?parseName(r.alts[0]):'';
      if(v){name=v;$('#kn').textContent=v+'?';show('#r1',0);show('#r2',1);await sayP(my,`${v}? Dobrze słyszę?`);continue}
      if(r.reason==='not-allowed'||r.reason==='service-not-allowed')toast('Нужно разрешить микрофон для этого сайта в Chrome',5000);
      if(++fails>=2){typing();await sayP(my,'Poproś mamę, żeby wpisała twoje imię.')}else await sayP(my,'Nie słyszę cię. Powiedz głośniej!')}
    S.kid=name;save();sfx.ding();jump();
    // 2) цвет Lumi
    stage().innerHTML=`<div class="colors">${COLORS.map((c,i)=>`<button data-c="${i}" class="${i===S.color?'on':''}" style="background:${c.m}"></button>`).join('')}</div><button class="next" id="cok">Gotowe ✓</button>`;
    await sayP(my,`Super${kidC()}! Jaki kolor mam mieć? Wybierz!`);
    for(;;){const b=await tapOne('[data-c],#cok');guard(my);if(b.id==='cok')break;
      S.color=+b.dataset.c;save();$('.lumiwrap').innerHTML=lumiHTML();jump();sfx.pop();
      stage().querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));say(COLORS[S.color].n,'en')}
    // 3) имя Lumi
    stage().innerHTML=`<div class="names">${LNAMES.map(n=>`<button data-n="${n}" class="${n===S.name?'on':''}">${n}</button>`).join('')}</div><button class="next" id="nok">Gotowe ✓</button>`;
    await sayP(my,'A jak mam mieć na imię?');
    for(;;){const b=await tapOne('[data-n],#nok');guard(my);if(b.id==='nok')break;
      S.name=b.dataset.n;save();jump();sfx.pop();stage().querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('on',x===b));say(`Jestem ${S.name}!`)}
    S.onboarded=true;save();stage().innerHTML='';sfx.tada();confetti(70);jump();
    await sayP(my,`Hurra! Jestem ${S.name}${kidC()}. Ruszamy w podróż!`);

/* ============ КАРТА ПУТЕШЕСТВИЯ ============ */
const isle=pos=>Math.floor(Math.min(pos,MAXPOS)/STEPS);
const node=(p,inner)=>`<div class="node" data-pos="${p}" style="--x:${Math.round(Math.sin(p*.9)*60)}px">${inner}</div>`;
function islHTML(i,open,cls=''){const[e,n]=ISLANDS[i];const ws=(S.isl[i]||[]).filter(id=>W[id]).slice(-10);
  return `<div class="isl ${open?'':'lock'} ${cls}"><div class="ie">${open?e:'❔'}</div><b>${open?n:'???'}</b>${open&&ws.length?`<div class="iw">${ws.map(pic).join('')}</div>`:''}</div>`}
function mapHTML(pos){let h='';
  for(let i=0;i<ISLANDS.length;i++){h+=node(i*STEPS,islHTML(i,i*STEPS<=pos));
    if(i<ISLANDS.length-1)for(let s=1;s<STEPS;s++){const p=i*STEPS+s;h+=node(p,`<div class="stone ${p<=pos?'done':''}"></div>`)}}
  return h}
function putMe(pos,anim){const old=$('.me');old&&old.remove();const n=$(`.node[data-pos="${Math.min(pos,MAXPOS)}"]`);if(!n)return;
  n.insertAdjacentHTML('beforeend',`<div class="me">${lumiHTML('tiny')}</div>`);n.scrollIntoView({block:'center',behavior:anim?'smooth':'auto'});if(anim)jump()}
function mapLine(pos){if(pos>=MAXPOS)return 'Jesteśmy na ostatniej wyspie! Jesteś super!';
  const left=STEPS-pos%STEPS;return `${pos%STEPS?'':`Jesteśmy na wyspie ${ISLANDS[isle(pos)][1]}! `}Jeszcze ${left===1?'jedna lekcja':left+' lekcje'} do nowej wyspy!`}
function mapScreen(){stopAll();
  app.innerHTML=`${topbar('<button class="iconbtn" id="back">🏠</button>')}<div class="bubble"></div><div class="map">${mapHTML(S.trip)}</div>`;
  $('#back').onclick=home;putMe(S.trip);const t=mapLine(S.trip);bubble(t);setTimeout(()=>say(t),300)}
// после урока: Lumi делает шаг по тропинке; каждые STEPS шагов — новый остров
async function travel(my,fresh){const from=Math.min(S.trip,MAXPOS),i0=isle(from);
  if(fresh.length)S.isl[i0]=(S.isl[i0]||[]).concat(fresh);
  S.trip++;save();const to=Math.min(S.trip,MAXPOS);
  app.innerHTML=`<div class="top"><div class="spacer"></div>${volBtn()}</div><div class="bubble"></div><div class="map">${mapHTML(from)}</div>`;
  putMe(from);await sleep(1100);guard(my);
  if(to===from){await sayP(my,mapLine(to));return}
  const n=$(`.node[data-pos="${to}"]`);
  if(to%STEPS===0){n.innerHTML=islHTML(to/STEPS,true,'new');putMe(to,true);sfx.tada();confetti(90);
    await sleep(400);await sayP(my,`Hurra! Nowa wyspa: ${ISLANDS[to/STEPS][1]}!`)}
  else{n.querySelector('.stone').classList.add('done');putMe(to,true);sfx.flip();tone(784,.15,'sine',.12,.1);await sleep(500);guard(my);
    await sayP(my,`Hop! ${mapLine(to)}`)}}

function stageScreen(){app.innerHTML=`<div class="lessontop"><button class="iconbtn" id="x">✕</button><div class="progress"><i id="pg"></i></div><div class="pill">⭐ <span id="stars">${S.stars}</span></div>${volBtn()}</div>
  <div class="lessonhead">${lumiHTML('small')}<div class="bubble"></div></div><div class="stage" id="stage"></div>`;
  $('#x').onclick=home;}
const stage=()=>$('#stage');
function setProgress(p){const g=$('#pg');if(g)g.style.width=Math.round(p*100)+'%'}
function addStars(n){S.stars+=n;save();const s=$('#stars');if(s)s.textContent=S.stars}
function tapOne(sel){return new Promise(res=>{const st=stage();const h=e=>{const t=e.target.closest(sel);if(!t||!st.contains(t))return;st.removeEventListener('click',h);res(t)};st.addEventListener('click',h)})}
function wstate(id){return S.words[id]||(S.words[id]={box:0,due:null,seen:0,ok:0,bad:0})}
function grade(id,res){const s=wstate(id);
  if(res==='good'){s.box=Math.min(5,Math.max(1,s.box)+1);s.ok++}
  else if(res==='bad'){s.box=1;s.bad++}
  else{s.box=Math.max(1,s.box)}
  s.due=addDays(today(),INTERVAL[s.box]);save()}
function known(){return Object.keys(S.words).filter(id=>W[id])}
function distractors(id,n){const pool=known().filter(x=>x!==id);const same=pool.filter(x=>W[x].t===W[id].t);
  let out=shuffle(same).slice(0,Math.ceil(n/2));
  out=out.concat(shuffle(pool.filter(x=>!out.includes(x)&&W[x].p!==W[id].p))).slice(0,n);
  if(out.length<n)out=out.concat(shuffle(Object.keys(W).filter(x=>x!==id&&!out.includes(x)))).slice(0,n);
  return out.filter(x=>W[x].en!==W[id].en)}
async function praise(my,big){
  if(big&&++combo%3===0){sfx.ding();await dance(my);return}
  sfx.ding();confetti(big?40:18);jump();const p=rnd(PRAISE);await sayP(my,S.kid&&Math.random()<.4?p.replace('!',kidC()+'!'):p)}

/* «повтори» — ребёнок говорит в микрофон. Засчитываем любую попытку.
   id — слово, или фраза {en, ok(alts)} для мини-диалогов */
async function speakTurn(my,id){const st=stage();const T=typeof id==='string'?{en:W[id].en,ok:a=>matches(a,id)}:id;
  const next=st.querySelector('.next');if(!SR&&next)next.classList.remove('hidden');
  for(let tries=0;tries<3;){
    const b=await tapOne('.mic,.again,.next');guard(my);
    if(b.classList.contains('again')){await sayE(my,T.en);continue}
    if(b.classList.contains('next'))return 'none';
    if(!SR){toast('Этот браузер не умеет слушать. Нажми «Dalej».');continue}
    tries++;b.classList.add('on');bubble('Słucham… 👂');const r=await listen();b.classList.remove('on');guard(my);
    if(r.reason==='not-allowed'||r.reason==='service-not-allowed'){toast('Нужно разрешить микрофон для этого сайта в Chrome',5000);next&&next.classList.remove('hidden');continue}
    if(r.ok){if(T.ok(r.alts)){addStars(2);await praise(my,true);return 'good'}
      addStars(1);sfx.ding();jump();await sayP(my,rnd(['Dobrze!','Prawie!','Ładnie!'])+' Posłuchaj jeszcze raz:');await sayE(my,T.en);return 'ok'}
    if(r.reason==='network'){toast('Нет интернета для распознавания речи');}
    await sayP(my,'Nie słyszę cię. Powiedz głośniej!');next&&next.classList.remove('hidden');
  }
  return 'none'}

  stage().innerHTML=`<div class="big pop">${pic(id)}</div><div class="word">${w.en}</div><div class="plword">${w.pl}</div>
  <div class="row"><button class="again">🔊</button><button class="mic">🎤</button></div><button class="next hidden">Dalej ➜</button>`;

  bubble(`${w.en}!`);await sayE(my,w.en);await sleep(350);guard(my);await sayE(my,w.en);
  await sayP(my,first?'Teraz ty! Naciśnij mikrofon i powtórz.':rnd(['Powtórz!','Teraz ty!','Powiedz to!']));

async function gamePick(my,targets,label){for(const id of targets){const w=W[id];const n=known().length>=10?4:3;
  const opts=shuffle([id,...distractors(id,n-1)]);
  stage().innerHTML=`<div class="grid g${opts.length===4?4:3}">${opts.map(o=>`<button class="tile" data-id="${o}">${pic(o)}</button>`).join('')}</div><button class="again">🔊</button>`;
  bubble(`Gdzie jest… ${w.en}?`);await say('Gdzie jest','pl');guard(my);await sayE(my,w.en);
  let first=true;
  for(;;){const b=await tapOne('.tile,.again');guard(my);
    if(b.classList.contains('again')){await sayE(my,w.en);continue}
    if(b.dataset.id===id){b.classList.add('ok');if(first)addStars(1);await praise(my,first);break}
    first=false;b.classList.add('no','gone');oops();await sayE(my,w.en)}

/* «Покорми Lumi»: Lumi просит предмет по-английски, ребёнок тащит его пальцем Lumi в рот (или просто нажимает) */
const feedable=id=>FEEDABLE.includes(W[id].t);
function wantText(id){const w=W[id];if(w.t==='jedzenie')return `I'm hungry! Give me the ${w.en}!`;
  if(w.t==='kolory'||w.t==='liczby')return `Give me ${w.en}!`;return `Give me the ${w.en}, please!`}
function backTile(t){t.classList.add('back');t.style.transform='';t._dx=t._dy=0}
function dragTo(L){return new Promise(res=>{const st=stage();
  const down=e=>{const a=e.target.closest('.again');if(a){st.removeEventListener('pointerdown',down);res(a);return}
    const t=e.target.closest('.tile');if(!t||t.classList.contains('gone'))return;e.preventDefault();
    const x0=e.clientX,y0=e.clientY;let moved=false;t.classList.remove('back');t.classList.add('drag');try{t.setPointerCapture(e.pointerId)}catch(_){}
    const mv=ev=>{const dx=ev.clientX-x0,dy=ev.clientY-y0;if(Math.hypot(dx,dy)>10)moved=true;t._dx=dx;t._dy=dy;t.style.transform=`translate(${dx}px,${dy}px) scale(1.15)`};
    const up=ev=>{t.removeEventListener('pointermove',mv);t.removeEventListener('pointerup',up);t.removeEventListener('pointercancel',up);t.classList.remove('drag');
      const m=L.getBoundingClientRect(),hit=ev.type==='pointerup'&&(!moved||(ev.clientX>m.left-30&&ev.clientX<m.right+30&&ev.clientY>m.top-30&&ev.clientY<m.bottom+30));
      if(!hit){backTile(t);return}st.removeEventListener('pointerdown',down);res(t)};
    t.addEventListener('pointermove',mv);t.addEventListener('pointerup',up);t.addEventListener('pointercancel',up)};
  st.addEventListener('pointerdown',down)})}
function flyInto(t,L){const a=t.getBoundingClientRect(),m=L.getBoundingClientRect();
  const x=m.left+m.width/2-(a.left+a.width/2-(t._dx||0)),y=m.top+m.height*.64-(a.top+a.height/2-(t._dy||0));
  t.classList.add('fly');t.style.transform=`translate(${x}px,${y}px) scale(.15)`}
async function gameFeed(my,targets,label){const head=$('.lessonhead .lumi');head&&head.classList.add('hidden');
  try{for(const id of targets){const opts=shuffle([id,...distractors(id,2)]);const txt=wantText(id);
    stage().innerHTML=`<div class="feedlumi">${lumiHTML()}</div><div class="grid g3 feed">${opts.map(o=>`<button class="tile" data-id="${o}">${pic(o)}</button>`).join('')}</div><button class="again">🔊</button>`;
    const L=stage().querySelector('.lumi');bubble(txt);await sayE(my,txt);
    let first=true;
    for(;;){const b=await dragTo(L);guard(my);
      if(b.classList.contains('again')){await sayE(my,txt);continue}
      if(b.dataset.id===id){flyInto(b,L);await sleep(420);guard(my);L.classList.add('eat');sfx.pop();tone(300,.1,'square',.06,.15);tone(260,.1,'square',.06,.35);
        if(first)addStars(1);await sayE(my,W[id].t==='jedzenie'?'Yummy! Thank you!':'Thank you!');L.classList.remove('eat');await praise(my,first);break}
      first=false;oops();backTile(b);L.classList.remove('nope');void L.offsetWidth;L.classList.add('nope');await sayE(my,'No, no! '+txt)}
    label&&grade(id,first?'good':'bad');step()}}
  finally{head&&head.classList.remove('hidden')}}

/* Мини-диалоги: Lumi спрашивает, ребёнок отвечает фразой. Засчитывается любая попытка, ключевое слово = +2 */
const art=w=>/^[aeiou]/i.test(w)?'an':'a';
function plural(w){if(['strawberry','candy'].includes(w))return w.slice(0,-1)+'ies';if(w==='tomato')return 'tomatoes';
  return ['apple','banana','pear','carrot','egg','cookie'].includes(w)?w+'s':w}
function fillTalk(d){const f=s=>s.replace(/\{kid\}/g,S.kid||'');return {...d,q:f(d.q),a:f(d.a),r:f(d.r)}}
function talkSet(n=2){const k=known().filter(id=>S.words[id].seen),dyn=[];
  const one=ts=>shuffle(k.filter(id=>ts.includes(W[id].t)))[0];
  let x=one(['jedzenie']);if(x){const p=plural(W[x].en);dyn.push({e:pic(x),q:'What do you like?',a:`I like ${p}.`,pl:'Co lubisz?',k:['like',W[x].en,p],r:`Mmm, ${p}! Me too!`})}
  x=one(['zwierzęta','dom','pojazdy']);if(x){const w=W[x].en;dyn.push({e:pic(x),q:'What is it?',a:`It's ${art(w)} ${w}.`,pl:'Co to jest?',k:[w],r:`Yes! ${cap(art(w))} ${w}!`})}
  x=one(['kolory']);if(x){const w=W[x].en;dyn.push({e:pic(x),q:'What color is it?',a:`It's ${w}.`,pl:'Jaki to kolor?',k:[w],r:`Yes! ${cap(w)}!`})}
  x=one(['liczby']);if(x){const w=W[x].en;dyn.push({e:pic(x),q:'What number is it?',a:`It's ${w}.`,pl:'Jaka to liczba?',k:[w,NUM[w]],r:`Yes! ${cap(w)}!`})}
  const st=shuffle(TALKS.filter(d=>!d.kid||S.kid));
  let out=[st[0],...shuffle(dyn),...st.slice(1)];
  if(!S.talkSeen){const first=[TALKS[0],S.kid?TALKS[1]:TALKS[2]];out=[...first,...out.filter(d=>!first.includes(d))]}
  return out.slice(0,n).map(fillTalk)}
async function gameTalk(my,items){
  for(const d of items){
    stage().innerHTML=`<div class="big pop">${d.e}</div><div class="q">${d.q}</div><div class="hint">${d.pl}</div><div class="ans hidden">💬 ${d.a}</div>
    <div class="row"><button class="again">🔊</button><button class="mic">🎤</button></div><button class="next hidden">Dalej ➜</button>`;
    bubble(d.q);await sayE(my,d.q);await sleep(250);guard(my);
    await sayP(my,'Odpowiedz! Powiedz tak:');stage().querySelector('.ans').classList.remove('hidden');bubble(d.a);await sayE(my,d.a);
    const r=await speakTurn(my,{en:d.a,ok:alts=>hasKey(alts,d.k)});
    if(r!=='none'){bubble(d.r);jump();await sayE(my,d.r)}
    step()}
  S.talkSeen=true;save()}

async function gameYesNo(my,targets,label){let firstRound=true;
  for(const id of targets){const truth=Math.random()<.5;const shown=truth?id:(distractors(id,1)[0]||id);const isTrue=shown===id;
    stage().innerHTML=`<div class="big pop">${pic(id)}</div><div class="row yn"><button class="yes" data-a="1">👍</button><button class="nob" data-a="0">👎</button></div><button class="again">🔊</button>`;
    bubble(`To jest… ${W[shown].en}?`);
    if(firstRound){await sayP(my,'Dobrze czy źle? Słuchaj!');firstRound=false}
    await sayE(my,W[shown].en);
    let first=true;
    for(;;){const b=await tapOne('.yes,.nob,.again');guard(my);
      if(b.classList.contains('again')){await sayE(my,W[shown].en);continue}
      if((b.dataset.a==='1')===isTrue){if(first)addStars(1);await praise(my,first);if(!isTrue){await say('To jest','pl');guard(my);await sayE(my,W[id].en)}break}
      first=false;oops();b.classList.add('no');await sayP(my,isTrue?'Ojej! To jest właśnie…':'Nie, to jest…');await sayE(my,W[id].en);break}
    label&&grade(id,first?'good':'bad');step()}}

async function gameSay(my,targets,label){for(const id of targets){const w=W[id];
  stage().innerHTML=`<div class="big pop">${pic(id)}</div><div class="row"><button class="again">💡</button><button class="mic">🎤</button></div><button class="next hidden">Dalej ➜</button>`;
  await sayP(my,'Jak to jest po angielsku?');
  // 💡 = подсказка: Lumi говорит слово
  let r=await speakTurn(my,id);
  if(r!=='good'&&r!=='ok'){bubble(w.en);await say('To jest','pl');guard(my);await sayE(my,w.en);}
  label&&grade(id,r==='good'?'good':'neutral');step()}}

async function gameMemory(my,ids){const cards=shuffle([...ids,...ids]);let open=[],done=0;
  stage().innerHTML=`<div class="mem">${cards.map((id,i)=>`<button class="card" data-id="${id}" data-i="${i}"><span class="back">⭐</span><span class="face">${pic(id)}</span></button>`).join('')}</div>`;
  await sayP(my,'Znajdź pary!');
  while(done<ids.length){const c=await tapOne('.card:not(.open)');guard(my);c.classList.add('open');sfx.flip();say(W[c.dataset.id].en,'en');open.push(c);
    if(open.length===2){const[a,b]=open;open=[];await sleep(700);guard(my);
      if(a.dataset.id===b.dataset.id){a.classList.add('done');b.classList.add('done');done++;sfx.ding()}
      else{await sleep(300);a.classList.remove('open');b.classList.remove('open')}}}
  addStars(2);await praise(my,true);step()}

let stepsDone=0,stepsTotal=1;function step(){stepsDone++;setProgress(stepsDone/stepsTotal)}

let startStars=0;
async function startSession(){stopAll();const my=RUN;
  if(!enV)pickVoices();
  const t=today();startStars=S.stars;combo=0;
  const fresh=ORDER.filter(id=>!S.words[id]||!S.words[id].seen).slice(0,S.perDay);
  const L=LEN[S.len]||LEN.mid;
  let due=known().filter(id=>S.words[id].seen&&S.words[id].due&&S.words[id].due<=t).sort((a,b)=>S.words[a].due.localeCompare(S.words[b].due)).slice(0,L.due);
  if(!fresh.length&&due.length<4)due=due.concat(shuffle(known().filter(id=>!due.includes(id))).slice(0,6-due.length));
  // если старых слов «по графику» мало — доигрываем знакомыми словами без оценки (коробки не меняются)
  const practice=shuffle(known().filter(id=>S.words[id].seen&&!due.includes(id)&&!fresh.includes(id))).slice(0,Math.min(L.extra,Math.max(0,L.due-due.length)));
  const blocks=[];
  // «покормить» можно не всеми словами (не «дай мне бабушку»), остальные слова уходят в «найди картинку»
  const add=(k,ids,label)=>{if(k!=='feed'){blocks.push({k,ids,label});return}
    const f=ids.filter(feedable),o=ids.filter(x=>!feedable(x));if(f.length)blocks.push({k,ids:f,label});if(o.length)blocks.push({k:'pick',ids:o,label})};
  if(fresh.length){blocks.push({k:'intro',ids:fresh});shuffle(['pick','balloons','feed','yesno']).slice(0,L.games).forEach(k=>add(k,shuffle(fresh)))}
  const types=shuffle(['pick','balloons','yesno','say','feed']);let ti=0;
  for(let i=0;i<due.length;i+=4)add(types[ti++%types.length],due.slice(i,i+4),1);
  for(let i=0;i<practice.length;i+=4)add(types[ti++%types.length],practice.slice(i,i+4));
  if(!due.length&&!practice.length&&fresh.length)blocks.push({k:'say',ids:shuffle(fresh)});
  blocks.push({k:'talk',ids:talkSet(L.talks)});
  const memIds=shuffle([...fresh,...due,...practice]).slice(0,3);if(memIds.length===3&&Math.random()<L.mem)blocks.push({k:'memory',ids:memIds});
  stepsDone=0;stepsTotal=blocks.reduce((s,b)=>s+(b.k==='memory'?1:b.ids.length),0)||1;
  stageScreen();
  const NAMES={pick:'Teraz zgadujemy! Pokaż, co mówię.',balloons:'Teraz balony! Przebij ten, który powiem.',yesno:'Teraz gra: dobrze czy źle?',say:'Teraz ty mówisz! Jak to jest po angielsku?',memory:'Na koniec: znajdź pary!',
    feed:'Jestem głodny! Daj mi to, o co poproszę. Przeciągnij palcem do mojej buzi!',talk:S.talkSeen?'Porozmawiajmy!':'Teraz porozmawiamy! Ja pytam, a ty odpowiadasz.'};
  try{
    if(!S.sessions)await sayP(my,`Cześć${kidC()}! Jestem ${S.name}. Będziemy razem uczyć się angielskiego!`);
    else if(due.length&&fresh.length)await sayP(my,'Hej! Dziś nowe słówka i stare przyjaciółki!');
    else await sayP(my,rnd(['Hej! Zaczynamy!','Super, że jesteś! Gramy!']));
    let firstIntro=!S.introSeen;
    for(const b of blocks){
      if(b.k==='intro'){for(const id of b.ids){await intro(my,id,firstIntro);firstIntro=false;S.introSeen=true;wstate(id).box=Math.max(1,wstate(id).box);wstate(id).due=addDays(t,1);save();step()}continue}
      stage().innerHTML=`<div class="big pop">${{pick:'🔍',balloons:'🎈',yesno:'👍',say:'🎤',memory:'🃏',feed:'🍽️',talk:'💬'}[b.k]}</div>`;
      await sayP(my,NAMES[b.k]);await sleep(300);guard(my);
      if(b.k==='pick')await gamePick(my,b.ids,b.label);
      if(b.k==='balloons')await gameBalloons(my,b.ids,b.label);
      if(b.k==='yesno')await gameYesNo(my,b.ids,b.label);
      if(b.k==='say')await gameSay(my,b.ids,b.label);
      if(b.k==='memory')await gameMemory(my,b.ids);
      if(b.k==='feed')await gameFeed(my,b.ids,b.label);
      if(b.k==='talk')await gameTalk(my,b.ids);
    }
    await finish(my,fresh);
  }catch(e){if(e!==STOP)console.error(e)}}

async function finish(my,fresh){const t=today();
  S.streak=S.lastDay===addDays(t,-1)?S.streak+1:(S.lastDay===t?S.streak:1);
  S.lastDay=t;S.extra=false;S.sessions++;save();setProgress(1);
  stage().innerHTML=`<button class="gift" id="gift">🎁</button>`;
  await sayP(my,'Brawo! Mam dla ciebie prezent. Otwórz!');
  await tapOne('#gift');guard(my);
  const missing=STICKERS.map((s,i)=>i).filter(i=>!S.stickers[i]);const i=missing.length?rnd(missing):Math.random()*STICKERS.length|0;
  S.stickers[i]=(S.stickers[i]||0)+1;addStars(3);
  S.log=S.log.concat({d:t,stars:S.stars-startStars,fresh}).slice(-90);save();sfx.tada();confetti(70);
  stage().innerHTML=`<div class="reveal">${STICKERS[i][0]}</div><div class="word">${STICKERS[i][1]}</div><button class="next" id="go">Dalej ➜</button>`;
  await sayP(my,'Nowa naklejka!');await sayE(my,STICKERS[i][1]);
  if(fresh.length){await say('Dziś poznałaś:','pl');guard(my);for(const id of fresh){await sayE(my,W[id].en)}}
  await tapOne('#go');guard(my);
  await travel(my,fresh);
  if(certDue()){S.certDay=t;save();await sleep(800);guard(my);await diploma(my);return}
  app.insertAdjacentHTML('beforeend','<button class="next mapbtn" id="home">🏠 Gotowe</button>');
  await sayP(my,`${S.name} jest zmęczony i idzie spać. Do jutra${kidC()}!`);
  await click($('#home'));guard(my);home()}

/* ============ ЭКРАН ДЛЯ РОДИТЕЛЕЙ (по-русски) ============ */
function parent(){stopAll();const ks=known().filter(id=>S.words[id].seen);
  const learned=ks.filter(id=>S.words[id].box>=4).length;const left=ORDER.length-ks.length;
  const voiceInfo=`Английский голос: ${enV?enV.name:'не найден'} · Польский голос: ${plV?plV.name:'не найден'} · Распознавание речи: ${SR?'есть':'нет'}`;
  app.innerHTML=`<div class="top"><div class="title" style="text-align:left">⚙️ Для родителей</div><div class="spacer"></div><button class="iconbtn" id="back">🏠</button></div>
  <div class="parent">
   <div class="box stat"><div><b>${learned}</b>выучено</div><div><b>${ks.length-learned}</b>в процессе</div><div><b>${left}</b>впереди</div></div>
   <div class="box">Занятий: <b>${S.sessions}</b> · Дней подряд: <b>${S.streak}</b> · Звёзд: <b>${S.stars}</b> · Наклеек: <b>${Object.keys(S.stickers).length}/${STICKERS.length}</b><br>
   Последнее занятие: <b>${S.lastDay||'ещё не было'}</b></div>
   <h2>Новых слов в день</h2><div class="box">${[3,5,7].map(n=>`<button class="pd ${S.perDay===n?'sel':''}" data-n="${n}">${n}</button>`).join('')}
   <div style="color:var(--muted);margin-top:6px">Плюс повторение старых слов.</div></div>
   <h2>Длина урока</h2><div class="box">${[['short','Короткий'],['mid','Обычный'],['long','Длинный']].map(([k,n])=>`<button class="ln ${S.len===k?'sel':''}" data-k="${k}">${n}</button>`).join('')}
   <div style="color:var(--muted);margin-top:6px">Короткий ≈ 5 минут, обычный ≈ 10, длинный ≈ 15. Длиннее = больше игр, повторения и диалогов (новых слов столько же).</div></div>
   <h2>Ещё один урок сегодня</h2><div class="box"><button id="extra">${S.extra?'✓ Разрешено':'Разрешить'}</button>
   <div style="color:var(--muted);margin-top:6px">Обычно 1 урок в день: так интерес держится дольше, чем если играть часами.</div></div>
   <h2>Неделя</h2><div class="box">${(w=>`За 7 дней: уроков <b>${w.n}</b>, новых слов <b>${w.words.length}</b>, звёзд <b>${w.stars}</b>
     ${w.words.length?`<div style="margin-top:4px">${w.words.map(id=>W[id].en).join(', ')}</div>`:''}`)(weekData())}<br>
     <button id="dip">🏅 Показать диплом</button><button id="share">📤 Отправить отчёт</button>
     <div style="color:var(--muted);margin-top:6px">Диплом сам появляется у ребёнка раз в неделю после урока (на польском, с картинками выученных слов).</div></div>
   <h2>Имя ребёнка</h2><div class="box"><input id="kid" value="${S.kid}" maxlength="14" placeholder="например, Zosia">
     <div style="color:var(--muted);margin-top:6px">Lumi хвалит по имени: «Brawo, Zosia!»</div></div>
   <h2>Имя персонажа</h2><div class="box"><input id="nm" value="${S.name.replace(/"/g,'')}" maxlength="14"></div>
   <h2>Звук</h2><div class="box"><button id="mus">${S.music?'🎵 Фоновая музыка: вкл':'🔇 Фоновая музыка: выкл'}</button>
     <div style="color:var(--muted);margin-top:6px">Кнопка 🎵/🔕 сверху включает и выключает музыку, 🔊 меняет громкость (3 уровня). Если всё равно тихо — громкость медиа кнопками телефона.</div></div>
   <h2>Знакомство</h2><div class="box"><button id="reob">Пройти знакомство заново</button>
     <div style="color:var(--muted);margin-top:6px">Ребёнок снова скажет имя и выберет цвет и имя персонажа. Прогресс сохранится.</div></div>
   <h2>Проверка</h2><div class="box"><button id="tv">🔊 Голос</button><button id="tm">🎤 Микрофон</button><div style="color:var(--muted);margin-top:6px;font-size:14px">${voiceInfo}</div></div>
   <h2>Слова (${ks.length})</h2><div class="box"><table>${ks.sort((a,b)=>S.words[b].box-S.words[a].box).map(id=>`<tr><td>${pic(id)}</td><td><b>${W[id].en}</b></td><td>${W[id].pl}</td><td class="dots">${'●'.repeat(S.words[id].box)}${'○'.repeat(5-S.words[id].box)}</td></tr>`).join('')||'<tr><td>Пока пусто</td></tr>'}</table>
   <div style="color:var(--muted);margin-top:6px;font-size:14px">●●●●○ и больше = слово выучено. Ошибка в игре возвращает слово на ●.</div></div>
   <h2>Сброс</h2><div class="box"><button class="danger" id="reset">Стереть весь прогресс</button></div>
  </div>`;
  $('#back').onclick=home;
  app.querySelectorAll('.pd').forEach(b=>b.onclick=()=>{S.perDay=+b.dataset.n;save();parent()});
  app.querySelectorAll('.ln').forEach(b=>b.onclick=()=>{S.len=b.dataset.k;save();parent()});
  $('#extra').onclick=()=>{S.extra=true;save();parent()};
  $('#nm').onchange=e=>{S.name=cleanName(e.target.value)||'Lumi';save()};
  $('#kid').onchange=e=>{S.kid=cap(cleanName(e.target.value));save()};
  $('#mus').onclick=()=>{S.music=!S.music;save();S.music?startMusic():stopMusic();parent()};
  $('#dip').onclick=()=>{stopAll();diploma(RUN)};
  $('#share').onclick=async()=>{const w=weekData();
    const txt=`🏅 ${S.kid||'Наша ученица'} за неделю в Lumi Słówka: уроков — ${w.n}, новых слов — ${w.words.length}${w.words.length?' ('+w.words.map(id=>W[id].en).join(', ')+')':''}, звёзд — ${w.stars}.`;
    try{if(navigator.share)await navigator.share({text:txt});else{await navigator.clipboard.writeText(txt);toast('Отчёт скопирован')}}catch(e){}};
  $('#reob').onclick=onboard;
  $('#tv').onclick=async()=>{pickVoices();await say('Cześć!','pl');await say('Hello! I am '+S.name,'en')};
  $('#tm').onclick=async e=>{e.target.textContent='🎤 Говорите по-английски…';const r=await listen();e.target.textContent='🎤 Микрофон';
    toast(r.ok?'Услышал: '+r.alts.slice(0,3).join(' / '):'Ошибка: '+r.reason,5000)};
  $('#reset').onclick=()=>{if(confirm('Точно стереть весь прогресс, звёзды и наклейки?')&&confirm('Совсем точно? Отменить нельзя.')){localStorage.removeItem(KEY);S={...DEF,words:{},stickers:{},hats:[],isl:{},log:[],trip:0};onboard()}};
}

S.onboarded?home():onboard();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
